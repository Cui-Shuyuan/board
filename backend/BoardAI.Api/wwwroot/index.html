<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Board AI 调试对话</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f7;
            color: #1c1c1e;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #fff;
            border-bottom: 1px solid #e5e5ea;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        header h1 { font-size: 16px; font-weight: 600; }
        .game-select {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
        }
        .game-select label { font-size: 13px; color: #8e8e93; }
        select, input[type="text"] {
            font-size: 14px;
            padding: 6px 10px;
            border: 1px solid #d1d1d6;
            border-radius: 8px;
            background: #fff;
            outline: none;
        }
        select:focus, input[type="text"]:focus { border-color: #007aff; }
        .toolbar {
            display: flex;
            gap: 8px;
            margin-left: 12px;
        }
        button {
            font-size: 13px;
            padding: 6px 12px;
            border: none;
            border-radius: 8px;
            background: #007aff;
            color: #fff;
            cursor: pointer;
        }
        button:hover { background: #0051d5; }
        button.secondary {
            background: #e5e5ea;
            color: #1c1c1e;
        }
        button.secondary:hover { background: #d1d1d6; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        main {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 16px;
            line-height: 1.5;
            font-size: 15px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .message.user {
            align-self: flex-end;
            background: #007aff;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .message.assistant {
            align-self: flex-start;
            background: #fff;
            border: 1px solid #e5e5ea;
            border-bottom-left-radius: 4px;
        }
        .message.system {
            align-self: center;
            background: #fff9c4;
            color: #5c4b00;
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 12px;
        }
        .message .meta {
            font-size: 11px;
            color: inherit;
            opacity: 0.7;
            margin-top: 4px;
        }
        .empty-state {
            text-align: center;
            color: #8e8e93;
            margin-top: 40px;
        }
        footer {
            background: #fff;
            border-top: 1px solid #e5e5ea;
            padding: 12px 16px;
            flex-shrink: 0;
        }
        .input-row {
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }
        .input-row textarea {
            flex: 1;
            min-height: 44px;
            max-height: 120px;
            padding: 10px 14px;
            border: 1px solid #d1d1d6;
            border-radius: 18px;
            font-size: 15px;
            resize: none;
            outline: none;
            font-family: inherit;
        }
        .input-row textarea:focus { border-color: #007aff; }
        .input-row button {
            height: 44px;
            padding: 0 18px;
            border-radius: 18px;
            font-size: 15px;
        }
        .loading {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #8e8e93;
            margin-top: 4px;
        }
        .dot {
            width: 6px;
            height: 6px;
            background: #8e8e93;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* ---- 聊天区思考气泡 ---- */
        .message.thinking {
            align-self: flex-start;
            background: #fff;
            border: 1px solid #e5e5ea;
            border-bottom-left-radius: 4px;
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 88px;
        }
        .thinking-dot {
            width: 8px;
            height: 8px;
            background: #c7c7cc;
            border-radius: 50%;
            animation: thinkPulse 1.6s infinite ease-in-out both;
        }
        .thinking-dot:nth-child(1) { animation-delay: 0s; }
        .thinking-dot:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes thinkPulse {
            0%, 60%, 100% {
                transform: translateY(0);
                background: #c7c7cc;
            }
            30% {
                transform: translateY(-8px);
                background: #007aff;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Board AI 调试对话</h1>
        <div class="game-select">
            <label for="gameSelect">游戏</label>
            <select id="gameSelect"></select>
        </div>
        <div class="toolbar">
            <button class="secondary" id="clearBtn" title="清空当前对话">清空</button>
            <button class="secondary" id="copyBtn" title="复制报文">复制报文</button>
        </div>
    </header>

    <main id="chatMain">
        <div class="empty-state">选择游戏后发送消息开始对话</div>
    </main>

    <footer>
        <div class="input-row">
            <textarea id="messageInput" placeholder="输入消息，按 Enter 发送，Shift+Enter 换行" rows="1"></textarea>
            <button id="sendBtn">发送</button>
        </div>
        <div id="loadingIndicator" class="loading" style="display: none;">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <span>正在思考，请稍候…</span>
        </div>
    </footer>

    <script>
        const API_BASE = '';
        const gameSelect = document.getElementById('gameSelect');
        const chatMain = document.getElementById('chatMain');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');
        const copyBtn = document.getElementById('copyBtn');
        const loadingIndicator = document.getElementById('loadingIndicator');

        let messages = [];

        async function loadGames() {
            try {
                const res = await fetch(`${API_BASE}/api/rules/games`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const games = await res.json();
                gameSelect.innerHTML = '';
                if (!Array.isArray(games) || games.length === 0) {
                    const opt = document.createElement('option');
                    opt.value = 'splendor';
                    opt.textContent = 'splendor';
                    gameSelect.appendChild(opt);
                    return;
                }
                games.forEach(g => {
                    const opt = document.createElement('option');
                    opt.value = g.id || g;
                    opt.textContent = g.name || g.id || g;
                    gameSelect.appendChild(opt);
                });
            } catch (err) {
                console.error('加载游戏列表失败', err);
                gameSelect.innerHTML = '<option value="splendor">splendor</option>';
                addSystemMessage('无法从后端获取游戏列表，已默认使用 splendor');
            }
        }

        let thinkingBubble = null;

        function mdToHtml(text) {
            // 先转义已有 HTML，防止 XSS
            const escaped = text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
            // Markdown 图片语法 → <img>
            const withImg = escaped.replace(
                /!\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/g,
                '<img src="$2" alt="$1" style="max-width:100%;border-radius:8px;margin:4px 0;" loading="lazy">'
            );
            // 换行 → <br>
            return withImg.replace(/\n/g, '<br>');
        }

        function addMessage(role, content, extra) {
            const empty = chatMain.querySelector('.empty-state');
            if (empty) empty.remove();

            const div = document.createElement('div');
            div.className = `message ${role}`;
            // assistant 消息用 innerHTML 渲染图片，其他用 textContent
            if (role === 'assistant') {
                div.innerHTML = mdToHtml(content);
            } else {
                div.textContent = content;
            }
            if (extra) {
                const meta = document.createElement('div');
                meta.className = 'meta';
                meta.textContent = extra;
                div.appendChild(meta);
            }
            chatMain.appendChild(div);
            chatMain.scrollTop = chatMain.scrollHeight;
        }

        function addSystemMessage(text) {
            addMessage('system', text);
        }

        function showThinking() {
            removeThinking();
            const empty = chatMain.querySelector('.empty-state');
            if (empty) empty.remove();

            const bubble = document.createElement('div');
            bubble.className = 'message thinking';
            bubble.id = 'thinkingBubble';
            for (let i = 0; i < 3; i++) {
                const dot = document.createElement('div');
                dot.className = 'thinking-dot';
                bubble.appendChild(dot);
            }
            chatMain.appendChild(bubble);
            chatMain.scrollTop = chatMain.scrollHeight;
            thinkingBubble = bubble;
        }

        function removeThinking() {
            if (thinkingBubble) {
                thinkingBubble.remove();
                thinkingBubble = null;
            }
        }

        function setLoading(isLoading) {
            sendBtn.disabled = isLoading;
            loadingIndicator.style.display = isLoading ? 'flex' : 'none';
            if (isLoading) {
                showThinking();
            } else {
                removeThinking();
            }
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            addMessage('user', text);
            messages.push({ role: 'user', content: text });
            messageInput.value = '';
            messageInput.style.height = 'auto';
            setLoading(true);

            try {
                const res = await fetch(`${API_BASE}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        game_id: gameSelect.value,
                        messages: messages
                    })
                });

                if (!res.ok) {
                    const errBody = await res.json().catch(() => ({}));
                    throw new Error(errBody.error || `HTTP ${res.status}`);
                }

                const data = await res.json();
                const reply = data.reply || '(无回复)';
                addMessage('assistant', reply);
                messages.push({ role: 'assistant', content: reply });
            } catch (err) {
                const errorText = `请求失败：${err.message}`;
                addSystemMessage(errorText);
                console.error(err);
            } finally {
                setLoading(false);
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        messageInput.addEventListener('input', () => {
            messageInput.style.height = 'auto';
            messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
        });

        clearBtn.addEventListener('click', () => {
            messages = [];
            thinkingBubble = null;
            chatMain.innerHTML = '<div class="empty-state">选择游戏后发送消息开始对话</div>';
        });

        copyBtn.addEventListener('click', async () => {
            const payload = JSON.stringify({
                game_id: gameSelect.value,
                messages: messages
            }, null, 2);
            try {
                await navigator.clipboard.writeText(payload);
                addSystemMessage('当前报文已复制到剪贴板');
            } catch {
                addSystemMessage('复制失败，请手动从控制台复制');
                console.log(payload);
            }
        });

        loadGames();
    </script>
</body>
</html>
