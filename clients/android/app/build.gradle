plugins {
    id 'com.android.application'
    id 'com.android.built-in-kotlin'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def unityNdkPath = project.findProperty('unity.androidNdkPath')
def unityNdkVersion = project.findProperty('unity.androidNdkVersion')

// App-local content API base URL.  Keep machine-specific values in
// clients/android/local.properties (ignored by git), for example:
//   board.api.baseUrl=http://127.0.0.1:5000
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def boardApiBaseUrl = localProperties.getProperty('board.api.baseUrl') ?: 'http://127.0.0.1:5000'
def escapedBoardApiBaseUrl = boardApiBaseUrl.replace('\\', '\\\\').replace('"', '\\"')

android {
    namespace 'com.boardai.tutorial.uaal'
    compileSdk 36
    buildToolsVersion '36.0.0'

    if (unityNdkPath != null) {
        ndkPath unityNdkPath
    }
    if (unityNdkVersion != null) {
        ndkVersion unityNdkVersion
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId 'com.boardai.tutorial.uaal'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.2.0'

        buildConfigField 'String', 'BOARD_API_BASE_URL', "\"${escapedBoardApiBaseUrl}\""

        ndk {
            abiFilters 'arm64-v8a'
            debugSymbolLevel 'none'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    lint {
        abortOnError false
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation project(':unityLibrary')

    // Unity 6's generated GameActivity is built on AndroidX GameActivity.
    // :unityLibrary has this as an implementation dependency, so expose it to
    // this module's compile/runtime classpaths explicitly.
    implementation 'androidx.games:games-activity:4.4.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.9.0'

    // Kotlin + Jetpack Compose native control layer.
    implementation platform('androidx.compose:compose-bom:2025.08.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.savedstate:savedstate:1.3.1'
    implementation 'androidx.annotation:annotation:1.9.1'

    // AGP does not expose a library module's implementation file dependencies
    // (unity-classes.jar) on the consumer's compile classpath. MainActivity
    // references UnityPlayer directly, so add it here only for compilation;
    // the runtime copy is packaged through :unityLibrary.
    compileOnly files(new File(project(':unityLibrary').projectDir, 'libs/unity-classes.jar'))

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
}
